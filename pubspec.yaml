name: rescue_pulse
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  http: ^1.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0
  flutter_map : ^6.1.0
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  geolocator: ^13.0.1
  camera: ^0.10.5+9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  # Android 13+ adaptive icon — reuses the same source image on a plain
  # background rather than needing a second separate asset.
  adaptive_icon_background: "#0D1B4C"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/Splash.png
